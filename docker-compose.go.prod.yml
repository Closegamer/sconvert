services:
  app-go:
    build: ./go
    ports:
      # Localhost-only, same pattern as the Python `app` service's
      # STREAMLIT_PORT binding — lets us smoke-test the Go stack directly
      # from the server before nginx ever points at it.
      - "127.0.0.1:${GO_PORT:-8090}:8080"
    environment:
      DATABASE_URL: postgres://sconvert:${GO_POSTGRES_PASSWORD:?GO_POSTGRES_PASSWORD is required}@db-go:5432/sconvert
      REDIS_URL: redis://redis-go:6379/0
      ADMIN_PATH: ${GO_ADMIN_PATH:?GO_ADMIN_PATH is required}
      ADMIN_USER: ${GO_ADMIN_USER:?GO_ADMIN_USER is required}
      ADMIN_PASSWORD: ${GO_ADMIN_PASSWORD:?GO_ADMIN_PASSWORD is required}
    depends_on:
      redis-go:
        condition: service_healthy
      db-go:
        condition: service_healthy
    restart: unless-stopped

  redis-go:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sconvert_go_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db-go:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sconvert
      POSTGRES_PASSWORD: ${GO_POSTGRES_PASSWORD:?GO_POSTGRES_PASSWORD is required}
      POSTGRES_DB: sconvert
    volumes:
      - sconvert_go_pgdata:/var/lib/postgresql/data
      - ./go/db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sconvert -d sconvert"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sconvert_go_pgdata:
  sconvert_go_redis_data:
