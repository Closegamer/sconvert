# Site paused: every path redirects to the stub page. To resume, set
# NGINX_CONF back to ./nginx/default.go.conf in .env and recreate nginx.
server {
    listen 80;
    server_name sconvert.ru www.sconvert.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sconvert.ru www.sconvert.ru;

    ssl_certificate /etc/letsencrypt/live/sconvert.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sconvert.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /paused {
        root /usr/share/nginx/paused;
        try_files /paused.html =404;
        add_header Cache-Control "no-store";
    }

    location / {
        return 302 /paused;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
