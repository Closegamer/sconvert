<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>sConvert — сайт временно недоступен</title>
<style>
  :root {
    --bg: #000000; --line: #1d3324; --text: #d9ffe3; --muted: #86b593;
    --accent: #1fcf62; --panel: #0c1610; --brand-glow: rgba(99, 255, 154, 0.15);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6faf7; --line: #d7e6dc; --text: #12261b; --muted: #4c6357;
      --accent: #178a45; --panel: #ffffff; --brand-glow: rgba(23, 138, 69, 0.12);
      color-scheme: light;
    }
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Consolas", "Roboto Mono", monospace;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box;
  }
  .card {
    max-width: 520px; width: 100%; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 40px 28px; box-shadow: 0 0 40px var(--brand-glow);
  }
  .brand { color: var(--accent); font-size: 2rem; font-weight: 700; letter-spacing: .02em; margin: 0 0 20px; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.5; margin: 0; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">sConvert</div>
    <h1>Сайт временно недоступен</h1>
  </main>
</body>
</html>
