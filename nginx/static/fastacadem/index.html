<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FastAcadem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --text: #14161f; --muted: #5d6378;
    --border: #e3e6ef; --accent: #6c5ce7; --accent-2: #00b8d9;
    --glow: rgba(108, 92, 231, .18); color-scheme: light;
    --zone-ok: rgba(34, 197, 94, .07); --zone-todo: rgba(239, 68, 68, .045);
  }
  [data-theme="dark"] {
    --bg: #0d0f17; --surface: #161925; --text: #eef0f7; --muted: #9aa1b8;
    --border: #262a3a; --accent: #8f7bff; --accent-2: #2fd3f0;
    --glow: rgba(143, 123, 255, .25); color-scheme: dark;
    --zone-ok: rgba(34, 197, 94, .07); --zone-todo: rgba(239, 68, 68, .055);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Manrope, system-ui, sans-serif; background: var(--bg);
    color: var(--text); line-height: 1.6; transition: background .3s, color .3s;
    background-image: radial-gradient(60rem 30rem at 85% -10%, var(--glow), transparent 70%);
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1100px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  h1, h3 { overflow-wrap: break-word; hyphens: auto; }

  header {
    position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 75%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .bar { display: flex; align-items: center; gap: 16px; padding-block: 14px; flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
  .logo i {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-style: normal;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; flex-shrink: 0;
  }
  .tools { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .seg button, .icon-btn {
    border: 0; background: none; color: var(--muted); font: inherit; font-size: .85rem;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 600;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  [data-mode="brief"] .full, [data-mode="full"] .brief { display: none !important; }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); font-size: 1rem; padding: 6px 10px; }

  nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  nav a {
    white-space: nowrap; padding: 7px 14px; border-radius: 10px; color: var(--muted);
    font-weight: 600; font-size: .92rem; transition: .2s;
  }
  nav a:hover { color: var(--text); background: var(--surface); }
  nav a.active { color: var(--accent); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }

  main { padding-block: 56px 80px; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.1; margin: 0 0 20px; letter-spacing: -.02em; }
  .grad { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { font-size: 1.15rem; color: var(--muted); max-width: 680px; }
  .os-badge {
    display: inline-block; margin-bottom: 18px; padding: 5px 12px; border-radius: 999px; font-size: .85rem;
    font-weight: 600; background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .os-badge b { color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 44px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 30px var(--glow); }
  .card .ic { font-size: 1.6rem; }
  .card h3 { margin: 8px 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: .92rem; }
  .stub {
    margin-top: 32px; padding: 40px; border: 2px dashed var(--border); border-radius: 18px;
    text-align: center; color: var(--muted);
  }
  .stub .ic { font-size: 3rem; }
  .narrow { max-width: 780px; margin-inline: auto; }
  .ltabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 24px; }
  .ltabs a { padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: .9rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); }
  .ltabs a:hover { color: var(--text); border-color: var(--accent); }
  .ltabs a.active { color: #fff; background: var(--accent); border-color: var(--accent); }
  .kicker { margin: 0 0 6px; color: var(--accent); font-weight: 800; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
  .meta { color: var(--muted); font-size: .9rem; margin: -8px 0 0; }
  .lesson .toc { padding: 0; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; padding: 0; list-style: none; }
  .toc button { font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; }
  .toc button:hover { border-color: var(--accent); }
  .lesson h2 { font-size: clamp(1.4rem, 3.4vw, 1.9rem); margin: 56px 0 12px; letter-spacing: -.01em; scroll-margin-top: 140px; }
  .lesson h3 { margin: 32px 0 8px; font-size: 1.12rem; }
  .lesson h3 .n { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 8px; font-size: .85rem; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); vertical-align: 2px; }
  .lesson ul { padding-left: 1.2em; }
  .lesson p a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .lesson li { margin: 6px 0; }
  .lesson :not(pre) > code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
  .code { display: flex; flex-direction: column-reverse; margin: 12px 0; background: #0f1220; border: 1px solid #262a3a; border-radius: 12px; }
  .code pre { margin: 0; padding: 4px 18px 16px; overflow-x: auto; font: .9rem/1.65 ui-monospace, Consolas, monospace; color: #e6e8f2; }
  .copy { align-self: flex-end; margin: 8px 8px 0; font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; color: #c9cde0; background: #1c2133; border: 1px solid #2f3550; border-radius: 8px; padding: 4px 10px; }
  .copy:hover { color: #fff; }
  .out { margin: -6px 0 16px; border: 1px dashed var(--border); border-top: 0; border-radius: 0 0 12px 12px; padding: 8px 18px 12px; }
  .out > b { display: block; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .out pre { margin: 0; overflow-x: auto; font: .82rem/1.6 ui-monospace, Consolas, monospace; color: var(--muted); }
  .out p { margin: 0; color: var(--muted); font-size: .9rem; }
  .out small { display: block; margin-top: 6px; color: var(--muted); font-size: .82rem; }
  .lesson h3 .n.ok { background: #22c55e; }
  .done { display: flex; flex-direction: row-reverse; width: fit-content; align-items: center; gap: 10px; margin: 18px 0 8px auto; padding: 10px 16px; cursor: pointer; user-select: none;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-weight: 600; font-size: .92rem; transition: border-color .2s, background .2s; }
  .done:hover { border-color: var(--accent); }
  .done input { width: 20px; height: 20px; margin: 0; cursor: pointer; accent-color: #22c55e; }
  .done .t1, .done:has(input:checked) .t0 { display: none; }
  .done:has(input:checked) .t1 { display: inline; color: #16a34a; }
  .done:has(input:checked) { border-color: #22c55e; background: color-mix(in srgb, #22c55e 10%, var(--surface)); }
  #zone { position: absolute; top: 0; left: 0; right: 0; z-index: -1; pointer-events: none; transition: background .4s; }
  .progress { margin: 20px 0 0; padding: 14px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .progress-bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; margin: 8px 0 6px; }
  .progress-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #22c55e); transition: width .3s; }
  .progress small { color: var(--muted); }
  .callout { margin: 16px 0; padding: 14px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent-2); }
  .callout.warn { border-left-color: #f5a524; }
  .callout p { margin: 4px 0; }
  .flow { display: flex; align-items: center; gap: 8px; margin: 16px 0; }
  .flow div { flex: 1 1 0; padding: 14px; text-align: center; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-weight: 600; }
  .flow div small { display: block; color: var(--muted); font-weight: 400; }
  .flow span { color: var(--accent); font-family: ui-monospace, Consolas, monospace; font-size: .8rem; font-weight: 700; white-space: nowrap; }
  .tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: 12px; }
  .tbl table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  .tbl td, .tbl th { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl th { background: var(--surface); }
  .tbl.cmp td:nth-child(2) { font-family: ui-monospace, Consolas, monospace; font-size: .88rem; color: var(--accent-2); }
  .tbl td:first-child { white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: .88rem; color: var(--accent); }
  .next { display: block; margin-top: 56px; padding: 26px; border-radius: 18px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); transition: transform .2s, box-shadow .2s; }
  .next:hover { transform: translateY(-3px); box-shadow: 0 14px 36px var(--glow); }
  .next h3 { margin: 0 0 6px; font-size: 1.3rem; }
  .next p { margin: 0; opacity: .92; }
  .back { display: inline-block; margin-bottom: 20px; color: var(--muted); font-weight: 600; }
  .back:hover { color: var(--accent); }
  @media (max-width: 640px) {
    .bar { gap: 10px; padding-block: 10px; }
    .logo { font-size: 1rem; }
    .tools { margin-left: 0; width: 100%; flex-wrap: wrap; }
    #mode { order: 3; flex-basis: 100%; }
    .seg { flex: 1; }
    .seg button { flex: 1; padding: 8px 6px; }
    .icon-btn { padding: 8px 12px; }
    nav { margin-inline: -20px; padding-inline: 20px; scroll-padding-inline: 20px; }
    nav a { padding: 9px 14px; }
    main { padding-block: 32px 56px; }
    .lead { font-size: 1.05rem; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); margin-top: 28px; gap: 12px; }
    .card { padding: 18px; }
    .stub { padding: 28px 18px; }
    .flow { flex-direction: column; align-items: stretch; text-align: center; }
    .tbl td { display: block; }
    .tbl td:not(:last-child) { padding-bottom: 0; border-bottom: 0; }
    .tbl td:first-child, .tbl.cmp td:nth-child(2) { white-space: normal; overflow-wrap: anywhere; }
    .tbl tr:has(th) { display: none; }
  }
  @media (min-width: 1600px) { .wrap { max-width: 1320px; } body { font-size: 17px; } }
  @media (hover: none) { .card:hover { transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  footer { border-top: 1px solid var(--border); padding-block: 24px max(24px, env(safe-area-inset-bottom)); color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <a href="#/" class="logo"><i>⚡</i>FastAcadem</a>
      <div class="tools">
        <div class="seg" id="os" role="group" aria-label="Операционная система">
          <button data-os="Windows">Windows</button>
          <button data-os="Linux">Linux</button>
          <button data-os="macOS">macOS</button>
        </div>
        <div class="seg" id="mode" role="group" aria-label="Подробность уроков">
          <button data-mode="brief">Краткий</button>
          <button data-mode="full">Развёрнутый</button>
        </div>
        <button class="icon-btn" id="theme" aria-label="Переключить тему">🌙</button>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<div id="zone" hidden></div>
<main class="wrap" id="app"></main>
<footer><div class="wrap">© FastAcadem — быстрое обучение для занятых людей</div></footer>

<script>
const PAGES = {
  accounts:     ['Аккаунты', '🔐', 'Регистрация и настройка нужных сервисов без лишней бюрократии.'],
  bots:         ['Боты', '🤖', 'Свой Telegram-бот за вечер: от токена до запуска.'],
  agents:       ['Агенты', '🧠', 'ИИ-агенты, которые делают рутину за вас.'],
  programming:  ['Программирование', '💻', 'Первые программы с нуля: от установки до работающего скрипта.'],
  databases:    ['Базы данных', '🗄️', 'Хранить, искать и не терять данные.'],
  integrations: ['Интеграции', '🔗', 'Связываем сервисы между собой через API.'],
  git:          ['Гит', '🌿', 'Версии кода без страха что-то сломать.'],
  docker:       ['Докер', '🐳', 'Запуск чего угодно одной командой.'],
  contacts:     ['Контакты', '✉️', 'Напишите нам — ответим быстро.'],
};
const $ = s => document.querySelector(s);
const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { } };

let os = store('os') || (/Mac/.test(navigator.platform) ? 'macOS' : /Linux/.test(navigator.platform) ? 'Linux' : 'Windows');
let mode = store('mode') || 'brief';
let theme = store('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

$('#nav').innerHTML = Object.entries(PAGES).map(([id, [t]]) => `<a href="#/${id}" data-id="${id}">${t}</a>`).join('');

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const code = s => `<div class="code"><pre>${esc(s.trim())}</pre><button class="copy">Копировать</button></div>`;
const by = o => o[os];
// out: undefined — без блока, '' — команда молчит, строка — ожидаемый вывод; note — пояснение под выводом
const out = (o, note = '') => `<div class="out"><b>Ожидаемый вывод</b>${o ? `<pre>${esc(o.trim())}</pre>` : '<p>Ничего не выводит — значит, всё прошло успешно.</p>'}${note ? `<small>${note}</small>` : ''}</div>`;
const step = (lesson, n) => `<span class="n" data-n="${lesson}-${n}">${n}</span>`;
const done = (lesson, n) => `<label class="done"><input type="checkbox" data-done="${lesson}-${n}"><span class="t0">Отметить прохождение</span><span class="t1">Пройдено</span></label>`;
// Фон урока: выше последнего отмеченного шага — лёгкий зелёный, ниже — лёгкий красный, граница — мягкий градиент
function zone() {
  const z = $('#zone'), boxes = [...document.querySelectorAll('#app [data-done]')];
  z.hidden = !boxes.length;
  if (!boxes.length) return;
  z.style.height = 0;
  const h = document.documentElement.scrollHeight, last = boxes.filter(b => b.checked).pop();
  const y = !last ? -200 : boxes.every(b => b.checked) ? h + 200 : last.closest('label').getBoundingClientRect().bottom + scrollY + 40;
  z.style.height = h + 'px';
  z.style.background = `linear-gradient(to bottom, var(--zone-ok) ${y - 100}px, var(--zone-todo) ${y + 100}px)`;
}
new ResizeObserver(zone).observe($('#app'));

function progress() {
  const boxes = [...document.querySelectorAll('#app [data-done]')], p = $('#app .progress');
  zone();
  if (!p) return;
  boxes.forEach(b => document.querySelector(`#app [data-n="${b.dataset.done}"]`)?.classList.toggle('ok', b.checked));
  const done = boxes.filter(b => b.checked).length;
  p.querySelector('i').style.width = (100 * done / boxes.length) + '%';
  p.querySelector('span').textContent = done === boxes.length ? `Все ${done} шагов пройдены 🎉` : `Пройдено ${done} из ${boxes.length}`;
}

const LESSONS = {
  git: () => `
  <article class="lesson">
    <p class="kicker">Гит · Урок 1</p>
    <h1>🌿 Git: основы</h1>
    <p class="meta"><span class="brief">≈ 7 минут · только суть и команды</span><span class="full">≈ 25 минут · с объяснениями и разбором ошибок</span></p>
    <ul class="toc">
      <li><button data-go="what">Что это</button></li>
      <li><button data-go="why">Зачем это вам</button></li>
      <li><button data-go="how">Как пользоваться</button></li>
      <li><button data-go="cheat">Шпаргалка</button></li>
    </ul>
    <div class="progress"><span></span><div class="progress-bar"><i></i></div>
      <small>Отмечайте пройденные шаги галочкой «Отметить прохождение» внизу каждого шага. Прогресс сохраняется в этом браузере.</small></div>

    <h2 id="what">Что это</h2>
    <p class="brief"><b>Git</b> — программа, которая хранит историю изменений файлов в папке проекта.
      Каждое сохранение (<b>коммит</b>) — снимок всех файлов, к которому можно вернуться в любой момент.</p>
    <div class="full">
      <p>Знакомо: <code>отчёт_финал.docx</code>, <code>отчёт_финал_2.docx</code>, <code>отчёт_финал_ТОЧНО_последний.docx</code>?
        <b>Git</b> делает то же самое, только правильно: в папке лежит одна актуальная версия файлов,
        а вся история аккуратно хранится в скрытой папке <code>.git</code>.</p>
      <p>Git — система контроля версий. Он работает на вашем компьютере, без интернета и бесплатно.
        Каждый раз, когда вы решаете «вот это состояние стоит запомнить», вы делаете <b>коммит</b> —
        снимок всех файлов с подписью: кто, когда и зачем изменил.</p>
      <div class="tbl"><table>
        <tr><th>Слово</th><th>Что значит</th></tr>
        <tr><td>Репозиторий</td><td>Папка проекта, за которой следит Git (внутри есть <code>.git</code>).</td></tr>
        <tr><td>Коммит</td><td>Сохранённый снимок проекта с комментарием.</td></tr>
        <tr><td>Индекс (stage)</td><td>«Корзина» изменений, которые войдут в следующий коммит.</td></tr>
        <tr><td>Ветка</td><td>Параллельная линия истории. Основная называется <code>main</code>.</td></tr>
        <tr><td>Remote</td><td>Копия репозитория на сервере, например на GitHub.</td></tr>
      </table></div>
      <p>Как изменения попадают в историю:</p>
      <div class="flow">
        <div>Рабочая папка<small>вы правите файлы</small></div><span>git add →</span>
        <div>Индекс<small>отобрали, что сохранить</small></div><span>git commit →</span>
        <div>История<small>снимок сохранён</small></div><span>git push →</span>
        <div>GitHub<small>копия в облаке</small></div>
      </div>
    </div>
    <div class="callout"><p><b>Git ≠ GitHub.</b> Git — программа на вашем компьютере.
      GitHub (а также GitLab, Bitbucket) — сайт, где хранят копии репозиториев и работают над ними вместе.</p></div>

    <h2 id="why">Зачем это вам</h2>
    <ul>
      <li><b>Машина времени.</b> Сломали — вернулись к рабочей версии за секунду.<span class="full"> Больше не страшно экспериментировать: любой эксперимент можно откатить.</span></li>
      <li><b>История.</b> Видно, что, когда и зачем менялось.<span class="full"> Через полгода вы не вспомните, зачем писали эту строку, — а коммит помнит.</span></li>
      <li><b>Бэкап.</b> Копия на GitHub переживёт поломку ноутбука.</li>

    <h2 id="what">Что это</h2>
    <p class="brief"><b>Docker</b> запускает программы в <b>контейнерах</b> — изолированных «коробках», где уже есть всё нужное:
      сама программа, библиотеки и настройки. Одна команда — и у вас работает база данных, веб-сервер или бот, без ручной установки.</p>
    <div class="full">
      <p>Знакомо: «у меня всё работает, а у тебя нет»? Программе нужна правильная версия языка, библиотек, настроек —
        и на каждом компьютере всё немного по-разному. <b>Docker</b> решает это так: программу упаковывают вместе со всем,
        что ей нужно, в один <b>образ</b>. Из образа запускается <b>контейнер</b> — и он работает одинаково на любом компьютере и сервере.</p>
      <p>Это как морской контейнер: неважно, что внутри — мебель или бананы, его одинаково грузят на любой корабль, поезд или грузовик.</p>
      <div class="tbl"><table>
        <tr><th>Слово</th><th>Что значит</th></tr>
        <tr><td>Образ (image)</td><td>Шаблон: программа + всё, что ей нужно. Только для чтения.</td></tr>
        <tr><td>Контейнер</td><td>Запущенный экземпляр образа. Из одного образа можно запустить много контейнеров.</td></tr>
        <tr><td>Docker Hub</td><td>Каталог готовых образов: nginx, postgres, redis, python и тысячи других.</td></tr>
        <tr><td>Dockerfile</td><td>Рецепт, по которому собирают свой образ.</td></tr>
        <tr><td>Том (volume)</td><td>Папка для данных, которая переживает удаление контейнера.</td></tr>
        <tr><td>Compose</td><td>Файл, описывающий несколько контейнеров сразу, — и запуск всех одной командой.</td></tr>
      </table></div>
      <p>Как это связано:</p>
      <div class="flow">
        <div>Docker Hub<small>каталог образов</small></div><span>docker pull →</span>
        <div>Образ<small>шаблон</small></div><span>docker run →</span>
        <div>Контейнер<small>работает</small></div>
      </div>
    </div>
    <div class="callout"><p><b>Контейнер ≠ виртуальная машина.</b> Виртуальная машина эмулирует целый компьютер со своей ОС и запускается минутами.
      Контейнер использует ядро вашей системы, весит мегабайты и стартует за секунду.</p></div>

    <h2 id="why">Зачем это вам</h2>
    <ul>
      <li><b>Что угодно — одной командой.</b> PostgreSQL, Redis, n8n, WordPress — без установщиков и настройки.<span class="full"> Нужна база для бота? Одна строка — и через 10 секунд она работает.</span></li>
      <li><b>Конец «у меня работает».</b> Контейнер ведёт себя одинаково на вашем ноутбуке, у коллеги и на сервере.</li>
      <li><b>Чистая система.</b> Удалили контейнер — от программы не осталось следов.<span class="full"> Можно держать рядом PostgreSQL 14 и 17 для разных проектов, и они не мешают друг другу.</span></li>
      <li><b>Простой деплой.</b> То, что работает у вас в Docker, так же запустится на сервере.<span class="full"> Этот сайт, например, тоже работает в Docker-контейнере.</span></li>
      <li><b>Это база.</b> Боты, агенты, базы данных и почти любой сервер сегодня запускают в Docker.</li>
    </ul>

      <small>Отмечайте пройденные шаги галочкой «Отметить прохождение» внизу каждого шага. Прогресс сохраняется в этом браузере.</small></div>

    <h2 id="what">Что это</h2>
    <p class="brief"><b>База данных</b> — программа, которая надёжно хранит данные и быстро находит нужное.
      <b>PostgreSQL</b> и <b>MySQL</b> хранят данные в таблицах и понимают язык <b>SQL</b>.
      <b>MongoDB</b> хранит «документы» — записи в формате, похожем на JSON. Не знаете, что выбрать, — берите PostgreSQL.</p>
    <div class="full">
      <p>Данные можно хранить и в Excel или текстовом файле — пока их мало и с ними работает один человек.
        Когда пользователей тысячи, а бот и сайт пишут данные одновременно, файл ломается и тормозит.
        <b>База данных</b> — это программа-сервер, которая решает именно эти задачи: хранит данные надёжно, не путается,
        когда к ней обращаются сразу многие, и за миллисекунды находит нужное среди миллионов записей.</p>
      <p>Базы бывают двух главных видов:</p>
      <ul>
        <li><b>Реляционные (SQL)</b> — PostgreSQL, MySQL. Данные лежат в <b>таблицах</b> со строгими колонками, как в Excel.
          Таблицы связаны между собой (пользователь → его заказы). Общаются с ними на языке <b>SQL</b>.</li>
        <li><b>Документные (NoSQL)</b> — MongoDB. Данные — это <b>документы</b>, похожие на JSON. У разных документов могут быть разные поля,
          заранее описывать структуру не нужно.</li>
      </ul>
      <div class="tbl"><table>
        <tr><th>База</th><th>Сильные стороны</th><th>Где встречается</th></tr>
        <tr><td>PostgreSQL</td><td>Самая мощная и строгая бесплатная SQL-база. Надёжность, сложные запросы, JSON внутри таблиц.</td><td>Боты, сервисы, аналитика. Выбор по умолчанию для новых проектов.</td></tr>
        <tr><td>MySQL</td><td>Простая, быстрая, очень распространённая.</td><td>WordPress, 1С-Битрикс, старые и PHP-проекты, хостинги.</td></tr>
        <tr><td>MongoDB</td><td>Гибкая структура, легко хранить «разношёрстные» данные.</td><td>Прототипы, логи, каталоги с разными полями, Node.js-проекты.</td></tr>
      </table></div>
      <div class="tbl"><table>
        <tr><th>SQL</th><th>MongoDB</th></tr>
        <tr><td>База (database)</td><td>База (database)</td></tr>
        <tr><td>Таблица (table)</td><td>Коллекция (collection)</td></tr>
        <tr><td>Строка (row)</td><td>Документ (document)</td></tr>
        <tr><td>Колонка (column)</td><td>Поле (field)</td></tr>
      </table></div>
    </div>
    <div class="callout"><p><b>Не знаете, что выбрать?</b> Берите <b>PostgreSQL</b>. MySQL — если этого требует готовая система (WordPress, Битрикс).
      MongoDB — если данные действительно без единой структуры.</p></div>

    <h2 id="why">Зачем это вам</h2>
    <ul>
      <li><b>Бот запоминает пользователей.</b> Подписки, настройки, история — всё переживёт перезапуск.</li>
      <li><b>Сайт и сервисы.</b> Заказы, товары, заявки — почти любое приложение хранит данные в базе.</li>
      <li><b>Быстрый поиск.</b> Найти нужное среди миллионов записей — за миллисекунды.<span class="full"> С индексами — даже среди миллиардов.</span></li>
      <li><b>Надёжность.</b> Данные не теряются при сбое, а резервная копия делается одной командой.</li>
      <li><b>Аналитика.</b> Один SQL-запрос заменяет час работы со сводными таблицами в Excel.<span class="full"> «Сколько заказов по городам за прошлый месяц» — три строки SQL.</span></li>
      <li><b>Работа нескольких программ сразу.</b> Бот, сайт и админка читают и пишут одни и те же данные и не мешают друг другу.</li>
    </ul>

    <h2 id="how">Как пользоваться (база)</h2>
    <p>Все три базы запустим в <b>Docker</b> — так не нужно ничего устанавливать в систему, а команды одинаковые на Windows, macOS и Linux.
      Если Docker ещё не стоит — сначала пройдите <a href="#/docker">урок по Docker</a> (хватит шагов 1–2).</p>

    <h3>${step("databases", 1)}Подготовьте рабочую папку</h3>
    ${code(`docker --version
mkdir db-lesson
cd db-lesson`)}
    ${out('Docker version 28.5.1, build e180ab8', 'Цифры могут отличаться.' + by({ Windows: ' <code>mkdir</code> ещё выведет таблицу с новой папкой — это нормально.', macOS: '', Linux: '' }) + ' Если <code>docker</code> не найден или пишет <code>Cannot connect</code> — ' + by({ Windows: 'запустите Docker Desktop.', macOS: 'запустите Docker Desktop.', Linux: 'выполните <code>sudo systemctl start docker</code>.' }))}
    ${done("databases", 1)}

    <h3>${step("databases", 2)}Запустите PostgreSQL</h3>
    ${code('docker run -d --name pg -e POSTGRES_PASSWORD=secret -p 5432:5432 -v pgdata:/var/lib/postgresql/data postgres:17')}
    ${out(`Unable to find image 'postgres:17' locally
17: Pulling from library/postgres

    <div class="full">
      <div class="tbl"><table>
        <tr><th>Часть</th><th>Что значит</th></tr>
        <tr><td>--name pg</td><td>Имя контейнера — по нему будем подключаться.</td></tr>
        <tr><td>-e POSTGRES_PASSWORD=secret</td><td>Пароль главного пользователя <code>postgres</code>. Без него контейнер не запустится.</td></tr>
        <tr><td>-p 5432:5432</td><td>5432 — стандартный порт PostgreSQL. Через него к базе подключаются программы.</td></tr>
        <tr><td>-v pgdata:…/data</td><td>Том <code>pgdata</code>: данные сохранятся, даже если удалить контейнер.</td></tr>
        <tr><td>postgres:17</td><td>Образ и версия. Версию лучше указывать явно.</td></tr>
      </table></div>
    </div>
    <div class="callout warn"><p><b>Пароль <code>secret</code> — только для учёбы на своём компьютере.</b><span class="full"> На сервере придумайте длинный пароль и не открывайте порт базы в интернет:
      пишите <code>-p 127.0.0.1:5432:5432</code> — тогда база доступна только с самого сервера. Открытые базы с простым паролем взламывают за часы.</span></p></div>

    <h3>${step("databases", 3)}Подключитесь к PostgreSQL</h3>
    ${code('docker exec -it pg psql -U postgres')}
    ${out(`psql (17.6 (Debian 17.6-1.pgdg13+1))
Type "help" for help.

postgres=#`, 'Приглашение <code>postgres=#</code> — вы внутри базы и можете писать SQL. Выйти — <code>\\q</code>.')}
    <p class="full"><code>psql</code> — консольный клиент PostgreSQL, он уже есть внутри контейнера. <code>-U postgres</code> — войти под главным пользователем.
      Каждая SQL-команда заканчивается точкой с запятой <code>;</code> — без неё psql ждёт продолжения (приглашение меняется на <code>postgres-#</code>).
      ${by({ Windows: 'Если вместо русских букв видите знаки вопроса — выйдите, выполните <code>chcp 65001</code> и подключитесь снова (лучше работать в приложении «Терминал»).', macOS: '', Linux: '' })}</p>

    <h3>${step("databases", 4)}Создайте таблицу и поработайте с данными (SQL)</h3>
    <p>Вставьте в <code>psql</code> по очереди:</p>
    ${code(`CREATE TABLE users (
  id SERIAL PRIMARY KEY,
  name TEXT NOT NULL,
  city TEXT,
  created_at TIMESTAMP DEFAULT now()
);
INSERT INTO users (name, city) VALUES ('Анна', 'Москва'), ('Борис', 'Казань'), ('Вера', 'Москва');
SELECT id, name, city FROM users WHERE city = 'Москва';`)}
    ${out(`CREATE TABLE
INSERT 0 3
 id | name |  city
----+------+--------
  1 | Анна | Москва
  3 | Вера | Москва
(2 rows)`, '<code>CREATE TABLE</code> — таблица создана, <code>INSERT 0 3</code> — добавлено 3 строки, дальше — результат поиска.')}
    <p>Изменим и удалим:</p>
    ${code(`UPDATE users SET city = 'Сочи' WHERE name = 'Борис';
DELETE FROM users WHERE name = 'Вера';
SELECT id, name, city FROM users;`)}
    ${out(`UPDATE 1
DELETE 1
 id | name  | city
----+-------+--------
  1 | Анна  | Москва
  2 | Борис | Сочи
(2 rows)`, 'Цифры после <code>UPDATE</code> и <code>DELETE</code> — сколько строк затронуто. <code>0</code> — значит, условие <code>WHERE</code> ничего не нашло.')}
    <div class="full">
      <p>Это четыре главные операции, их называют <b>CRUD</b>: Create (<code>INSERT</code>), Read (<code>SELECT</code>), Update (<code>UPDATE</code>), Delete (<code>DELETE</code>).
        На них построено 90% работы с любой базой.</p>
      <ul>
        <li><code>SERIAL PRIMARY KEY</code> — уникальный номер строки, база ставит его сама: 1, 2, 3…</li>
        <li><code>NOT NULL</code> — поле обязательно. Попробуйте <code>INSERT INTO users (city) VALUES ('Омск');</code> — получите ошибку.</li>
        <li><code>DEFAULT now()</code> — если не указать время, база подставит текущее.</li>
        <li>Строки пишутся в <b>одинарных</b> кавычках: <code>'Москва'</code>.</li>
      </ul>
      <div class="callout warn"><p><b>Всегда пишите <code>WHERE</code> в <code>UPDATE</code> и <code>DELETE</code>.</b>
        <code>DELETE FROM users;</code> без условия удалит <b>все</b> строки — без вопросов и без корзины.</p></div>
      <p>Полезные команды psql: <code>\\dt</code> — список таблиц, <code>\\d users</code> — структура таблицы, <code>\\l</code> — список баз.</p>
    </div>
    <p>Выйдите из psql: <code>\\q</code></p>
    ${done("databases", 4)}

docker exec -it mysql mysql -uroot -psecret lesson`)}

    'Пользователи и права доступа', 'Бэкапы по расписанию', 'Подключение из Python и Node.js', 'Redis: кэш и очереди'],
  docker: ['Dockerfile: свой образ', 'Многоэтапная сборка и лёгкие образы', 'Тома и бэкапы данных', 'Сети между контейнерами',
    'Compose: приложение + база данных', 'Переменные окружения и .env', 'Публикация образа: Docker Hub и GHCR', 'Docker на сервере: деплой и автообновление'],
};

// Раздел = один урок (функция) или несколько ({ t, f }); урок N открывается по #/раздел/N
function lessonView(id, sub, badge) {
  const list = [].concat(LESSONS[id]).map(l => typeof l === 'function' ? { f: l } : l);
  const i = Math.min(Math.max(parseInt(sub) || 1, 1), list.length) - 1;
  const tabs = list.length > 1 ? `<nav class="ltabs">${list.map((l, k) =>
    `<a href="#/${id}${k ? '/' + (k + 1) : ''}"${k === i ? ' class="active"' : ''}>Урок ${k + 1}. ${l.t}</a>`).join('')}</nav>` : '';
  return `<div class="narrow">${badge}${tabs}${list[i].f()}</div>`;
}

function render() {
  const [id, sub] = location.hash.slice(2).split('/');
  const page = PAGES[id];
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  $('#nav a.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  document.querySelectorAll('#os button').forEach(b => b.setAttribute('aria-pressed', b.dataset.os === os));
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  document.documentElement.dataset.mode = mode;
  const badge = `<span class="os-badge">Уроки для <b>${os}</b> · <b>${mode === 'brief' ? 'кратко' : 'развёрнуто'}</b></span>`;

  $('#app').innerHTML = page && sub === 'advanced' && ADVANCED[id] ? `
    <section class="hero">
      <a class="back" href="#/${id}">← Основы</a><br>${badge}
      <p class="kicker">${page[0]} · продвинутый уровень</p>
      <h1>${page[1]} Продвинутый ${page[0].toLowerCase()}</h1>
      <div class="stub"><div class="ic">🚧</div>
        <h3>Уроки в разработке</h3>
        <p>Скоро здесь появятся:</p>
        <p>${ADVANCED[id].join(' · ')}</p>
      </div>
    </section>` : page && LESSONS[id] ? lessonView(id, sub, badge) : page ? `
    <section class="hero">${badge}
      <h1>${page[1]} ${page[0]}</h1>
      <p class="lead">${page[2]}</p>
      <div class="stub"><div class="ic">🚧</div>
        <h3>Раздел в разработке</h3>
        <p class="brief">Скоро здесь появятся короткие уроки для ${os}: только команды и шаги.</p>
        <p class="full">Скоро здесь появятся подробные уроки для ${os}: с объяснением каждого шага, скриншотами и разбором ошибок.</p>
      </div>
    </section>` : `
    <section class="hero">${badge}
      <h1>Учитесь <span class="grad">быстро</span>.<br>Делайте то, что нужно.</h1>
      <p class="lead brief">Короткие практические уроки без воды. Для Windows, Linux и macOS.</p>
      <p class="lead full">FastAcadem — академия быстрого обучения для занятых людей. Никакой воды и долгих курсов —
        только короткие практические уроки, после которых вы сразу сделаете нужное дело:
        заведёте аккаунт, запустите бота, настроите агента, базу данных или Docker.
        Каждый урок — для Windows, Linux и macOS.</p>
      <div class="cards">${Object.entries(PAGES).filter(([k]) => k !== 'contacts').map(([k, [t, ic, d]]) =>
        `<a class="card" href="#/${k}"><div class="ic">${ic}</div><h3>${t}</h3><p>${d}</p></a>`).join('')}
      </div>
    </section>`;
  document.querySelectorAll('#app [data-done]').forEach(b => b.checked = store('done:' + b.dataset.done) === '1');
  progress();
  document.title = (page ? page[0] + ' — ' : '') + 'FastAcadem';
}

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  $('#theme').textContent = theme === 'dark' ? '☀️' : '🌙';
}

$('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store('theme', theme); applyTheme(); };
$('#mode').onclick = e => { if (e.target.dataset.mode) { mode = e.target.dataset.mode; store('mode', mode); render(); } };
$('#app').onclick = e => {
  const go = e.target.closest('[data-go]');
  if (go) document.getElementById(go.dataset.go).scrollIntoView({ behavior: 'smooth' });
  const b = e.target.closest('.copy');
  if (b) navigator.clipboard.writeText(b.previousElementSibling.textContent).then(() => {
    b.textContent = 'Скопировано ✓'; setTimeout(() => b.textContent = 'Копировать', 1500);
  });
};
$('#app').onchange = e => {
  if (e.target.dataset.done) { store('done:' + e.target.dataset.done, e.target.checked ? '1' : ''); progress(); }
};
$('#os').onclick = e => { if (e.target.dataset.os) { os = e.target.dataset.os; store('os', os); render(); } };
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
applyTheme(); render();
</script>
</body>
</html>
