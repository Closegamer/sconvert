services:
  app-go:
    build: ./go
    ports:
      - "${GO_PORT:-8090}:8080"
    environment:
      REDIS_URL: redis://redis-go:6379/0
      DATABASE_URL: postgres://sconvert:${GO_POSTGRES_PASSWORD:-dev_only_change_me}@db-go:5432/sconvert
      # Local-dev-only defaults so the dashboard is reachable while testing
      # side-by-side. Override ADMIN_PATH/ADMIN_USER/ADMIN_PASSWORD in a
      # real .env before this ever touches a public server.
      ADMIN_PATH: ${GO_ADMIN_PATH:-_dev_stats_local}
      ADMIN_USER: ${GO_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${GO_ADMIN_PASSWORD:-dev_only_change_me}
    depends_on:
      redis-go:
        condition: service_healthy
      db-go:
        condition: service_healthy
    restart: unless-stopped

  redis-go:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db-go:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sconvert
      POSTGRES_PASSWORD: ${GO_POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: sconvert
    volumes:
      - sconvert_go_pgdata:/var/lib/postgresql/data
      - ./go/db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sconvert -d sconvert"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sconvert_go_pgdata:
