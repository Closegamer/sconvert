{{define "page:units"}}
<p class="title">{{index .T "units.title"}}</p>
<p class="subtitle">{{index .T "units.subtitle"}}</p>
<input type="search" id="sc-units-search" class="sc-search-input" placeholder="{{index .T "search.placeholder"}}" autocomplete="off">
<button type="button" id="sc-units-collapse-all" class="sc-collapse-all-btn">{{index .T "units.collapse_all"}}</button>

<div id="sc-units-list">
{{range .Categories}}
{{template "unit_category_panel" (dict "T" $.T "Cat" .)}}
{{end}}
</div>

<script>window.SCONVERT_UNITS = {{.UnitsJSON}};</script>
<script src="/static/js/units.js"></script>
{{end}}
