{{define "layout"}}
<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="{{.Description}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="yandex-verification" content="3c93613f1bcf5ed3">
  <link rel="canonical" href="{{.Canonical}}">
  <link rel="alternate" hreflang="x-default" href="{{.SiteBaseURL}}">
  <link rel="alternate" hreflang="ru" href="{{.SiteBaseURL}}">
  <link rel="alternate" hreflang="en" href="{{.SiteBaseURL}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="sConvert">
  <meta property="og:title" content="{{.Title}}">
  <meta property="og:description" content="{{.Description}}">
  <meta property="og:url" content="{{.Canonical}}">
  <meta property="og:locale" content="{{.OGLocale}}">
  <meta property="og:image" content="{{.OGImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{.Title}}">
  <meta name="twitter:description" content="{{.Description}}">
  <meta name="twitter:image" content="{{.OGImage}}">
  <script type="application/ld+json">{{.JSONLD}}</script>
  <link rel="stylesheet" href="/static/home.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();
    for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window, document, "script", "https://mc.yandex.ru/metrika/tag.js?id=109708961", "ym");

    ym(109708961, "init", {
      ssr: true,
      webvisor: true,
      clickmap: true,
      ecommerce: "dataLayer",
      accurateTrackBounce: true,
      trackLinks: true
    });
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/109708961" style="position:absolute; left:-9999px;" alt=""></div></noscript>
</head>
<body>
  <header class="sc-header">
    <a class="brand-link" href="/">{{index .T "nav.home"}}</a>
    <nav class="sc-nav" id="sc-nav">
      <a href="/units">{{index .T "nav.units"}}</a>
      <a href="/currency">{{index .T "nav.currency"}}</a>
      <a href="/btc">{{index .T "nav.btc"}}</a>
      <a href="/latex">{{index .T "nav.latex"}}</a>
      <a href="/calculators">{{index .T "nav.calculators"}}</a>
      <a href="/about">{{index .T "nav.about"}}</a>
    </nav>
    <div class="sc-header-actions">
      <button type="button" class="sc-lang-toggle-btn" title="RU / EN" aria-label="Switch language" onclick="sconvertToggleLang()">{{if eq .Lang "en"}}EN{{else}}RU{{end}}</button>
      <button type="button" class="theme-toggle-btn" title="Light / Dark" aria-label="Toggle color theme" onclick="sconvertToggleTheme()">
        <span class="theme-icon theme-icon-sun">☀️</span>
        <span class="theme-icon theme-icon-moon">🌙</span>
      </button>
      <button type="button" class="sc-nav-toggle-btn" id="sc-nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="sc-nav">☰</button>
    </div>
  </header>

  <main class="main">
    <div class="block-container">
      {{.Content}}
    </div>
  </main>

  <footer class="page-footer">
    <span>© sConvert</span>
    <span> · </span>
    <a class="footer-link" href="/privacy">{{index .T "footer.privacy"}}</a>
  </footer>

  <button type="button" id="sc-scroll-top" class="sc-scroll-top-btn" aria-label="Scroll to top" title="↑">↑</button>

  <script>
    (function () {
      var btn = document.getElementById("sc-scroll-top");
      if (!btn) return;
      var SHOW_AFTER_PX = 400;
      function onScroll() {
        btn.classList.toggle("sc-visible", window.scrollY > SHOW_AFTER_PX);
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
      btn.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    })();
  </script>

  <script>
    (function () {
      var toggleBtn = document.getElementById("sc-nav-toggle");
      var nav = document.getElementById("sc-nav");
      if (!toggleBtn || !nav) return;
      toggleBtn.addEventListener("click", function () {
        var isOpen = nav.classList.toggle("sc-nav-open");
        toggleBtn.setAttribute("aria-expanded", String(isOpen));
        toggleBtn.textContent = isOpen ? "✕" : "☰";
      });
      nav.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
          nav.classList.remove("sc-nav-open");
          toggleBtn.setAttribute("aria-expanded", "false");
          toggleBtn.textContent = "☰";
        });
      });
    })();
  </script>

  <script>
    function sconvertToggleLang() {
      var current = document.documentElement.getAttribute("lang") === "en" ? "en" : "ru";
      var next = current === "en" ? "ru" : "en";
      document.cookie = "sconvert_lang=" + next + "; path=/; max-age=31536000; samesite=lax";
      window.location.reload();
    }
  </script>

  <script>
    (function () {
      var KEY = "sconvert_theme";
      function currentTheme() {
        try { return localStorage.getItem(KEY) === "light" ? "light" : "dark"; }
        catch (e) { return "dark"; }
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
      }
      applyTheme(currentTheme());
      window.sconvertToggleTheme = function () {
        var next = currentTheme() === "light" ? "dark" : "light";
        try { localStorage.setItem(KEY, next); } catch (e) {}
        applyTheme(next);
      };
    })();
  </script>
</body>
</html>
{{end}}
